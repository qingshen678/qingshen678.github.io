<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>浣熊选号网</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --bg-raised: #fffdf8;
        --bg-soft: #ece7db;
        --ink: #1d1a15;
        --ink-2: #5c554a;
        --ink-3: #8d8474;
        --line: #ddd5c4;
        --accent: #c2540a;
        --accent-ink: #ffffff;
        --accent-soft: #f7e3d2;
        --wechat: #1f9d4d;
        --wechat-soft: #dff3e4;
        --gold: #a5760a;
        --gold-soft: #f6ecc9;
        --shadow: 0 10px 30px rgba(46, 34, 12, 0.14);
        --hero-bg: #211a12;
        --hero-ink: #f7f0e2;
        --hero-ink-2: #c9bda6;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14110d;
          --bg-raised: #1e1a15;
          --bg-soft: #29241d;
          --ink: #f2ecdf;
          --ink-2: #b7ad99;
          --ink-3: #857c6a;
          --line: #37312a;
          --accent: #e06f1c;
          --accent-soft: #3d2812;
          --wechat: #2fbf5f;
          --wechat-soft: #17301e;
          --gold: #ddb545;
          --gold-soft: #38300f;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
          --hero-bg: #0d0b08;
          --hero-ink: #f7f0e2;
          --hero-ink-2: #a99c84;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
        line-height: 1.55;
      }
      button { font: inherit; cursor: pointer; }
      img { display: block; max-width: 100%; }

      .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

      /* ---------- 顶部品牌区 ---------- */
      header.brand {
        background: var(--hero-bg);
        color: var(--hero-ink);
        padding: 26px 0 22px;
        border-bottom: 4px solid var(--accent);
      }
      .brand-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
      .brand-mark {
        width: 58px; height: 58px; flex: none;
        border-radius: 16px;
        background: var(--accent);
        display: grid; place-items: center;
      }
      .brand-mark svg { width: 40px; height: 40px; }
      .brand h1 {
        margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: 0.04em; font-weight: 800;
      }
      .brand .sub { margin: 3px 0 0; color: var(--hero-ink-2); font-size: 14px; letter-spacing: 0.12em; }
      .brand-note {
        margin: 16px 0 0; font-size: 14.5px; color: var(--hero-ink-2); max-width: 34em;
      }
      .brand-note strong { color: var(--hero-ink); }
      .brand-wx {
        margin-left: auto; text-align: right; font-size: 13px; color: var(--hero-ink-2);
      }
      .brand-wx .wx-id {
        display: block; font-size: 19px; font-weight: 700; color: var(--hero-ink); letter-spacing: 0.03em;
      }
      @media (max-width: 560px) {
        .brand h1 { font-size: 25px; }
        .brand-mark { width: 48px; height: 48px; border-radius: 13px; }
        .brand-mark svg { width: 33px; height: 33px; }
        .brand-wx { margin-left: 0; text-align: left; width: 100%; }
      }

      /* ---------- 工具栏：筛选 + 搜索 ---------- */
      .toolbar {
        position: sticky; top: 0; z-index: 20;
        background: var(--bg);
        padding: 14px 0 10px;
        border-bottom: 1px solid var(--line);
      }
      .toolbar-inner { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
      .tab {
        border: 1.5px solid var(--line); background: var(--bg-raised); color: var(--ink-2);
        padding: 8px 18px; border-radius: 999px; font-size: 15px; font-weight: 600;
      }
      .tab[aria-pressed="true"] {
        background: var(--ink); color: var(--bg); border-color: var(--ink);
      }
      .search { flex: 1 1 180px; margin-left: auto; position: relative; }
      .search input {
        width: 100%; padding: 10px 14px 10px 38px; font: inherit; font-size: 15px;
        border: 1.5px solid var(--line); border-radius: 999px;
        background: var(--bg-raised); color: var(--ink);
      }
      .search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
      .search svg {
        position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
        width: 17px; height: 17px; color: var(--ink-3); pointer-events: none;
      }
      .count-line { margin: 10px 2px 0; font-size: 13.5px; color: var(--ink-3); }
      .count-line strong { color: var(--ink-2); }

      /* ---------- 账号卡片 ---------- */
      main { padding: 20px 0 48px; }
      .grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
      @media (min-width: 620px) { .grid { grid-template-columns: 1fr 1fr; } }
      @media (min-width: 960px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
      .card {
        position: relative;
        background: var(--bg-raised); border: 1px solid var(--line); border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 1px 3px rgba(46, 34, 12, 0.06);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
      .card-link { position: absolute; inset: 0; z-index: 2; border-radius: inherit; }
      .card-link:focus-visible { outline: 2.5px solid var(--accent); outline-offset: -2.5px; }
      .card-cover { position: relative; aspect-ratio: 16 / 10; background: var(--bg-soft); }
      .card-cover img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
      .card-cover .game-badge {
        position: absolute; left: 10px; top: 10px;
        background: rgba(16, 12, 6, 0.78); color: #f7f0e2;
        font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em;
        padding: 4px 10px; border-radius: 6px;
      }
      .card-cover .sample-badge {
        position: absolute; right: 10px; top: 10px;
        background: rgba(16, 12, 6, 0.62); color: #e8dfca;
        font-size: 12px; padding: 4px 9px; border-radius: 6px;
      }
      .card-body { padding: 14px 16px 16px; }
      .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
      .card-id { font-size: 21px; font-weight: 800; letter-spacing: 0.03em; }
      .card-price { font-size: 19px; font-weight: 800; color: var(--accent); white-space: nowrap; }
      .card-price .unit { font-size: 13px; font-weight: 600; }
      .empty {
        border: 1.5px dashed var(--line); border-radius: 14px; padding: 44px 20px;
        text-align: center; color: var(--ink-2); font-size: 15px; background: var(--bg-raised);
      }
      .empty p { margin: 0; }
      .empty .small { margin-top: 6px; font-size: 13.5px; color: var(--ink-3); }

      /* ---------- 页脚 ---------- */
      footer {
        border-top: 1px solid var(--line); padding: 22px 0 34px;
        color: var(--ink-3); font-size: 13.5px;
      }
      footer .frow { display: flex; flex-wrap: wrap; gap: 8px 26px; }
      footer b { color: var(--ink-2); }

      /* ---------- 详情弹层 ---------- */
      .overlay {
        position: fixed; inset: 0; z-index: 50; display: none;
        background: rgba(12, 9, 5, 0.55);
      }
      .overlay.open { display: block; }
      .sheet {
        position: absolute; left: 0; right: 0; bottom: 0; top: 4%;
        background: var(--bg); border-radius: 18px 18px 0 0;
        overflow-y: auto; overscroll-behavior: contain;
        max-width: 760px; margin: 0 auto;
        box-shadow: var(--shadow);
      }
      @media (min-width: 820px) {
        .sheet { top: 5%; bottom: 5%; border-radius: 18px; }
      }
      .sheet-head {
        position: sticky; top: 0; z-index: 5;
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--line);
      }
      .sheet-head .t { font-size: 16px; font-weight: 700; }
      .close-btn {
        border: 1px solid var(--line); background: var(--bg-raised); color: var(--ink);
        width: 36px; height: 36px; border-radius: 50%; font-size: 18px; line-height: 1;
        display: grid; place-items: center;
      }

      /* 画廊 */
      .gallery { position: relative; background: #0d0b08; }
      .gallery-main { position: relative; }
      .gallery-main img { width: 100%; height: auto; }
      .gallery .sample-badge {
        position: absolute; left: 12px; top: 12px; z-index: 3;
        background: rgba(16, 12, 6, 0.66); color: #e8dfca;
        font-size: 12.5px; padding: 4px 10px; border-radius: 6px;
      }
      .g-nav {
        position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
        width: 40px; height: 40px; border-radius: 50%; border: none;
        background: rgba(16, 12, 6, 0.55); color: #fff; font-size: 20px; line-height: 1;
        display: grid; place-items: center;
      }
      .g-nav.prev { left: 10px; } .g-nav.next { right: 10px; }
      .g-counter {
        position: absolute; right: 12px; bottom: 12px; z-index: 3;
        background: rgba(16, 12, 6, 0.66); color: #fff;
        font-size: 12.5px; padding: 3px 9px; border-radius: 999px;
      }
      .thumbs { display: flex; gap: 8px; padding: 10px 12px; overflow-x: auto; background: var(--bg-soft); }
      .thumbs button {
        flex: none; width: 84px; height: 54px; padding: 0; border-radius: 8px; overflow: hidden;
        border: 2.5px solid transparent; background: none;
      }
      .thumbs button[aria-current="true"] { border-color: var(--accent); }
      .thumbs img { width: 100%; height: 100%; object-fit: cover; }

      .detail-body { padding: 20px 18px 30px; }
      .detail-id-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .detail-id { font-size: 28px; font-weight: 800; letter-spacing: 0.03em; margin: 0; }
      .detail-price { font-size: 24px; font-weight: 800; color: var(--accent); }
      .detail-price .unit { font-size: 14px; font-weight: 600; }
      .spec { margin: 18px 0 0; border-top: 1px solid var(--line); }
      .spec div {
        display: flex; gap: 14px; padding: 11px 2px; border-bottom: 1px solid var(--line);
        font-size: 15px;
      }
      .spec dt { flex: none; width: 76px; color: var(--ink-3); }
      .spec dd { margin: 0; font-weight: 600; letter-spacing: 0.02em; }

      /* 咨询区 */
      .consult {
        margin-top: 22px; background: var(--bg-raised); border: 1px solid var(--line);
        border-radius: 14px; padding: 18px;
      }
      .consult h3 { margin: 0 0 4px; font-size: 17px; }
      .consult p { margin: 0; font-size: 14px; color: var(--ink-2); }
      .wx-box {
        margin-top: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        background: var(--wechat-soft); border-radius: 10px; padding: 12px 14px;
      }
      .wx-box .label { font-size: 13px; color: var(--ink-2); }
      .wx-box .wx-id { font-size: 21px; font-weight: 800; letter-spacing: 0.04em; }
      .copy-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
      .btn {
        flex: 1 1 140px; border: none; border-radius: 10px; padding: 13px 14px;
        font-size: 15.5px; font-weight: 700;
      }
      .btn-wechat { background: var(--wechat); color: #fff; }
      .btn-ghost { background: var(--bg-soft); color: var(--ink); border: 1px solid var(--line); }
      .btn-accent { background: var(--accent); color: var(--accent-ink); }

      /* 大图查看 */
      .lightbox {
        position: fixed; inset: 0; z-index: 80; display: none;
        background: rgba(5, 4, 2, 0.94); flex-direction: column;
      }
      .lightbox.open { display: flex; }
      .lightbox-stage { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 54px 12px 12px; min-height: 0; }
      .lightbox-stage img { max-width: 100%; height: auto; margin: 0 auto; border-radius: 6px; }
      .lightbox-bar {
        display: flex; align-items: center; justify-content: center; gap: 14px; padding: 14px;
      }
      .lightbox-bar button {
        border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.08); color: #fff;
        border-radius: 999px; padding: 9px 20px; font-size: 15px; font-weight: 600;
      }
      .lightbox-close {
        position: absolute; top: 14px; right: 14px;
        width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.35);
        background: rgba(255,255,255,0.08); color: #fff; font-size: 19px; display: grid; place-items: center;
      }
      .lightbox-count { color: rgba(255,255,255,0.75); font-size: 14px; min-width: 44px; text-align: center; }

      /* 复制提示 */
      .toast {
        position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(16px);
        background: var(--ink); color: var(--bg); font-size: 14.5px; font-weight: 600;
        padding: 11px 20px; border-radius: 999px; opacity: 0; pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease; z-index: 100; white-space: nowrap;
        box-shadow: var(--shadow);
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      @media (prefers-reduced-motion: reduce) {
        .card, .toast { transition: none; }
        .card:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <header class="brand">
      <div class="wrap">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <circle cx="10" cy="9" r="5.5" fill="#f7f0e2"/>
              <circle cx="38" cy="9" r="5.5" fill="#f7f0e2"/>
              <circle cx="10" cy="9" r="2.4" fill="#211a12"/>
              <circle cx="38" cy="9" r="2.4" fill="#211a12"/>
              <ellipse cx="24" cy="26" rx="16" ry="14" fill="#f7f0e2"/>
              <path d="M9 20c4-3.4 9.4-5 15-5s11 1.6 15 5c-1 3.4-2.6 6-4.8 7.6C31.4 25 27.8 24 24 24s-7.4 1-10.2 3.6C11.6 26 10 23.4 9 20Z" fill="#211a12"/>
              <circle cx="17.5" cy="22.5" r="2" fill="#f7f0e2"/>
              <circle cx="30.5" cy="22.5" r="2" fill="#f7f0e2"/>
              <ellipse cx="24" cy="32" rx="3.4" ry="2.4" fill="#211a12"/>
              <path d="M24 34.4v2M20.5 39c1.2.8 2.4 1.2 3.5 1.2s2.3-.4 3.5-1.2" stroke="#211a12" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </div>
          <div>
            <h1>浣熊选号网</h1>
            <p class="sub">交易游 · 浣熊</p>
          </div>
          <div class="brand-wx">
            咨询微信
            <span class="wx-id">Gouwen1996</span>
          </div>
        </div>
        <p class="brand-note">在售账号都在这里，点开卡片看详情图。看中哪个，<strong>记下编号</strong>，加微信 <strong>Gouwen1996</strong> 咨询购买。</p>
      </div>
    </header>

    <div class="toolbar">
      <div class="wrap">
        <div class="toolbar-inner">
          <div class="tabs" role="group" aria-label="按游戏筛选" id="gameTabs"></div>
          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
            <input type="search" id="searchInput" placeholder="按编号搜索，如 hx1125" autocomplete="off" />
          </label>
        </div>
        <p class="count-line" id="countLine"></p>
      </div>
    </div>

    <main>
      <div class="wrap">
        <div class="grid" id="cardGrid"></div>
        <div class="empty" id="emptyState" hidden>
          <p id="emptyText">没有符合条件的账号</p>
          <p class="small">换个编号搜搜看，或者加微信 Gouwen1996 直接问。</p>
        </div>
      </div>
    </main>

    <footer>
      <div class="wrap">
        <div class="frow">
          <span>浣熊选号网 · 交易游</span>
          <span>咨询微信：<b>Gouwen1996</b></span>
          <span>购买时报账号编号，确认更快</span>
        </div>
      </div>
    </footer>

    <!-- 详情 -->
    <div class="overlay" id="detailOverlay" role="dialog" aria-modal="true" aria-label="账号详情">
      <div class="sheet">
        <div class="sheet-head">
          <span class="t" id="detailTitle">账号详情</span>
          <button class="close-btn" id="detailClose" aria-label="关闭详情">✕</button>
        </div>
        <div class="gallery" id="gallery">
          <div class="gallery-main" id="galleryMain">
            <img id="galleryImg" alt="" role="button" tabindex="0" aria-label="点击查看大图" title="点击查看大图" />
            <span class="sample-badge" id="gallerySample" hidden>示例图 · 实拍图陆续更新</span>
            <button class="g-nav prev" id="gPrev" aria-label="上一张">‹</button>
            <button class="g-nav next" id="gNext" aria-label="下一张">›</button>
            <span class="g-counter" id="gCounter"></span>
          </div>
          <div class="thumbs" id="thumbs"></div>
        </div>
        <div class="detail-body">
          <div class="detail-id-row">
            <h2 class="detail-id" id="detailId"></h2>
            <span class="detail-price" id="detailPrice"></span>
          </div>
          <dl class="spec">
            <div><dt>编号</dt><dd id="detailCode"></dd></div>
            <div><dt>游戏</dt><dd id="detailGame"></dd></div>
            <div><dt>价格</dt><dd id="detailPriceRow"></dd></div>
          </dl>
          <div class="consult">
            <h3>咨询购买</h3>
            <p>加卖家微信咨询，记得报上账号编号，确认库存和价格更快。</p>
            <div class="wx-box">
              <div>
                <span class="label">卖家微信号</span>
                <span class="wx-id">Gouwen1996</span>
              </div>
            </div>
            <div class="copy-row">
              <button class="btn btn-wechat" id="copyWxBtn">复制微信号</button>
              <button class="btn btn-ghost" id="copyIdBtn">复制编号</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 大图 -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片大图查看">
      <button class="lightbox-close" id="lbClose" aria-label="关闭大图">✕</button>
      <div class="lightbox-stage"><img id="lbImg" alt="" /></div>
      <div class="lightbox-bar">
        <button id="lbPrev">‹ 上一张</button>
        <span class="lightbox-count" id="lbCount"></span>
        <button id="lbNext">下一张 ›</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script>
      "use strict";

      /* ================================================================
         账号数据 —— 以后上新号，往 ACCOUNTS 里加一条即可：
         {
           id: "hx03",                 // 编号
           title: "",                   // 自定义标题，显示在卡片和详情大标题处；留空则显示编号
           game: "delta",               // "delta" = 三角洲行动 | "pubg" = PUBG
           price: 6800,                 // 售价（元）；还没定价填 null，页面显示「面议」
           images: ["编号-1.jpg"], // 详情图文件名，可多张；图片文件放在 assets 目录下，封面用第一张
           coverPos: "",                // 可选：卡片封面的裁剪位置（CSS object-position），如 "center 23%" 表示从长图约 23% 高度处起裁；留空从顶部裁。只影响卡片封面，详情长图不受影响
           sampleImages: false          // 图片是示例图时填 true，页面会标注「示例图」
         }
         ================================================================ */
      var WECHAT_ID = "Gouwen1996";

      var GAMES = [
        { key: "all",   label: "全部" },
        { key: "pubg",  label: "PUBG" },
        { key: "delta", label: "三角洲行动" }
      ];
      var GAME_NAMES = { pubg: "PUBG", delta: "三角洲行动" };

      var ACCOUNTS = [
        {
          id: "hx1125",
          title: "",

          coverPos: "center 23%",
          sampleImages: false
        }
      ];

      /* ---------- 状态 ---------- */
      var state = { game: "all", query: "" };
      var current = null;   // 当前详情账号
      var imgIndex = 0;     // 当前图片序号

      /* ---------- 工具 ---------- */
      function $(id) { return document.getElementById(id); }
      function priceText(price) {
        if (price === null || price === undefined) return "面议";
        return "¥" + Number(price).toLocaleString("zh-CN");
      }
      function priceHTML(price) {
        if (price === null || price === undefined) return "面议";
        return "<span class=\"unit\">¥</span>" + Number(price).toLocaleString("zh-CN");
      }
      var toastTimer = null;
      function toast(msg) {
        var t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
      }
      function copyText(text, okMsg) {
        function done() { toast(okMsg); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () { fallback(); });
        } else { fallback(); }
        function fallback() {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand("copy"); done(); }
          catch (e) { toast("复制失败，请长按手动复制"); }
          document.body.removeChild(ta);
        }
      }

      /* ---------- 筛选标签 ---------- */
      function renderTabs() {
        var box = $("gameTabs");
        box.innerHTML = "";
        GAMES.forEach(function (g) {
          var b = document.createElement("button");
          b.className = "tab";
          b.textContent = g.label;
          b.setAttribute("aria-pressed", state.game === g.key ? "true" : "false");
          b.addEventListener("click", function () {
            state.game = g.key;
            renderTabs(); renderList();
          });
          box.appendChild(b);
        });
      }

      /* ---------- 列表 ---------- */
      function filtered() {
        var q = state.query.trim().toLowerCase();
        return ACCOUNTS.filter(function (a) {
          if (state.game !== "all" && a.game !== state.game) return false;
          if (q && a.id.toLowerCase().indexOf(q) === -1) return false;
          return true;
        });
      }
      function renderList() {
        var list = filtered();
        var grid = $("cardGrid");
        grid.innerHTML = "";
        list.forEach(function (a) {
          var card = document.createElement("article");
          card.className = "card";
          var cardTitle = (a.title && a.title.trim()) ? a.title : a.id;
          card.innerHTML =
            "<div class=\"card-cover\">" +
              "<img src=\"" + a.images[0] + "\" alt=\"" + GAME_NAMES[a.game] + " 账号 " + a.id + " 封面图\" loading=\"lazy\"" + (a.coverPos ? " style=\"object-position:" + a.coverPos + "\"" : "") + " />" +
              "<span class=\"game-badge\">" + GAME_NAMES[a.game] + "</span>" +
              (a.sampleImages ? "<span class=\"sample-badge\">示例图</span>" : "") +
            "</div>" +
            "<div class=\"card-body\">" +
              "<div class=\"card-top\">" +
                "<span class=\"card-id\">" + cardTitle + "</span>" +
                "<span class=\"card-price\">" + priceHTML(a.price) + "</span>" +
              "</div>" +
            "</div>" +
            "<a class=\"card-link\" href=\"#\" aria-label=\"查看账号 " + a.id + " 详情\"></a>";
          card.querySelector(".card-link").addEventListener("click", function (e) {
            e.preventDefault();
            openDetail(a);
          });
          grid.appendChild(card);
        });
        $("emptyState").hidden = list.length > 0;
        $("emptyText").textContent = state.query.trim()
          ? "没有找到编号「" + state.query.trim() + "」的账号"
          : "这一类暂时没有在售账号";
        $("countLine").innerHTML = "当前在售 <strong>" + list.length + "</strong> 个账号 · 共收录 " + ACCOUNTS.length + " 个";
      }

      /* ---------- 详情与画廊 ---------- */
      function openDetail(a) {
        current = a;
        imgIndex = 0;
        $("detailTitle").textContent = "账号 " + a.id;
        $("detailId").textContent = (a.title && a.title.trim()) ? a.title : a.id;
        $("detailPrice").innerHTML = priceHTML(a.price);
        $("detailCode").textContent = a.id;
        $("detailGame").textContent = GAME_NAMES[a.game];
        $("detailPriceRow").textContent = priceText(a.price);
        renderThumbs();
        showImage(0);
        $("detailOverlay").classList.add("open");
        document.body.style.overflow = "hidden";
      }
      function closeDetail() {
        $("detailOverlay").classList.remove("open");
        document.body.style.overflow = "";
        current = null;
      }
      function renderThumbs() {
        var box = $("thumbs");
        box.innerHTML = "";
        box.style.display = current.images.length > 1 ? "flex" : "none";
        current.images.forEach(function (src, i) {
          var b = document.createElement("button");
          b.setAttribute("aria-label", "查看第 " + (i + 1) + " 张图");
          b.setAttribute("aria-current", i === imgIndex ? "true" : "false");
          var im = document.createElement("img");
          im.src = src; im.alt = "";
          b.appendChild(im);
          b.addEventListener("click", function () { showImage(i); });
          box.appendChild(b);
        });
      }
      function showImage(i) {
        if (!current) return;
        var n = current.images.length;
        imgIndex = ((i % n) + n) % n;
        var img = $("galleryImg");
        img.src = current.images[imgIndex];
        img.alt = GAME_NAMES[current.game] + " 账号 " + current.id + " 详情图 " + (imgIndex + 1);
        $("gallerySample").hidden = !current.sampleImages;
        $("gCounter").textContent = (imgIndex + 1) + " / " + n;
        $("gPrev").style.display = n > 1 ? "grid" : "none";
        $("gNext").style.display = n > 1 ? "grid" : "none";
        var thumbs = $("thumbs").children;
        for (var k = 0; k < thumbs.length; k++) {
          thumbs[k].setAttribute("aria-current", k === imgIndex ? "true" : "false");
        }
        if ($("lightbox").classList.contains("open")) syncLightbox();
      }
      function syncLightbox() {
        $("lbImg").src = current.images[imgIndex];
        $("lbImg").alt = $("galleryImg").alt;
        $("lbCount").textContent = (imgIndex + 1) + " / " + current.images.length;
      }
      function openLightbox() {
        if (!current) return;
        syncLightbox();
        $("lightbox").classList.add("open");
      }
      function closeLightbox() { $("lightbox").classList.remove("open"); }

      /* ---------- 事件 ---------- */
      $("searchInput").addEventListener("input", function (e) {
        state.query = e.target.value;
        renderList();
      });
      $("detailClose").addEventListener("click", closeDetail);
      $("detailOverlay").addEventListener("click", function (e) {
        if (e.target === $("detailOverlay")) closeDetail();
      });
      $("gPrev").addEventListener("click", function () { showImage(imgIndex - 1); });
      $("gNext").addEventListener("click", function () { showImage(imgIndex + 1); });
      $("galleryImg").addEventListener("click", openLightbox);
      $("galleryImg").addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLightbox(); }
      });
      $("galleryImg").style.cursor = "zoom-in";
      $("lbClose").addEventListener("click", closeLightbox);
      $("lbPrev").addEventListener("click", function () { showImage(imgIndex - 1); });
      $("lbNext").addEventListener("click", function () { showImage(imgIndex + 1); });
      $("copyWxBtn").addEventListener("click", function () {
        copyText(WECHAT_ID, "微信号已复制： " + WECHAT_ID);
      });
      $("copyIdBtn").addEventListener("click", function () {
        if (current) copyText(current.id, "编号已复制： " + current.id);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          if ($("lightbox").classList.contains("open")) closeLightbox();
          else if ($("detailOverlay").classList.contains("open")) closeDetail();
        }
        if ($("lightbox").classList.contains("open")) {
          if (e.key === "ArrowLeft") showImage(imgIndex - 1);
          if (e.key === "ArrowRight") showImage(imgIndex + 1);
        }
      });
      /* 画廊左右滑动 */
      var touchX = null;
      $("galleryMain").addEventListener("touchstart", function (e) {
        touchX = e.changedTouches[0].clientX;
      }, { passive: true });
      $("galleryMain").addEventListener("touchend", function (e) {
        if (touchX === null) return;
        var dx = e.changedTouches[0].clientX - touchX;
        if (Math.abs(dx) > 42) showImage(imgIndex + (dx < 0 ? 1 : -1));
        touchX = null;
      }, { passive: true });

      renderTabs();
      renderList();
    </script>
  </body>
</html>
